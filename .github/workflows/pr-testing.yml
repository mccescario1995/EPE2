name: Transition Jira Issue to TESTING

on:
  pull_request:
    types: [opened]

jobs:
  transition-to-testing:
    if: startsWith(github.head_ref, 'epe-')
    runs-on: ubuntu-latest

    steps:
      - name: Extract summary from branch name
        id: branch
        run: |
          BRANCH="${{ github.head_ref }}"
          CLEAN=$(echo "$BRANCH" | sed 's/-/ /g' | sed 's/epe //i')
          echo "summary=EPE: $CLEAN" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH → Summary: EPE: $CLEAN"

      - name: Find Jira Issue by summary
        id: find-issue
        env:
          JIRA_BASE_URL: ${{ secrets.EPE2_JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.EPE2_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.EPE2_JIRA_API_TOKEN }}
          ISSUE_SUMMARY: ${{ steps.branch.outputs.summary }}
        run: |
          AUTH=$(echo -n "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" | base64 -w 0)

          # Build the JQL and payload using jq for safe escaping
          PAYLOAD=$(jq -n \
            --arg summary "$ISSUE_SUMMARY" \
            '{
              jql: ("project = DC AND summary ~ \"" + $summary + "\" AND cf[10033] = EPE ORDER BY created DESC"),
              maxResults: 1,
              fields: ["key", "summary"]
            }')

          echo "Search payload: $PAYLOAD"

          RESPONSE=$(curl -s \
            -X POST \
            "${JIRA_BASE_URL}/rest/api/3/search/jql" \
            -H "Authorization: Basic ${AUTH}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Search response: $RESPONSE"

          ISSUE_KEY=$(echo "$RESPONSE" | jq -r '.issues[0].key')

          if [ -z "$ISSUE_KEY" ] || [ "$ISSUE_KEY" == "null" ]; then
            echo "::error::No Jira issue found matching summary: ${ISSUE_SUMMARY}"
            exit 1
          fi

          echo "Found issue: $ISSUE_KEY"
          echo "key=$ISSUE_KEY" >> $GITHUB_OUTPUT

      - name: Transition to TESTING
        env:
          JIRA_BASE_URL: ${{ secrets.EPE2_JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.EPE2_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.EPE2_JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.find-issue.outputs.key }}
        run: |
          AUTH=$(echo -n "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" | base64 -w 0)

          TRANSITIONS=$(curl -s \
            "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions" \
            -H "Authorization: Basic ${AUTH}" \
            -H "Content-Type: application/json")

          echo "Available transitions: $TRANSITIONS"

          TESTING_ID=$(echo "$TRANSITIONS" | jq -r '.transitions[] | select(.name == "TESTING") | .id')

          if [ -n "$TESTING_ID" ]; then
            curl -s -X POST \
              "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions" \
              -H "Authorization: Basic ${AUTH}" \
              -H "Content-Type: application/json" \
              -d "{\"transition\": {\"id\": \"$TESTING_ID\"}}"
            echo "Transitioned ${ISSUE_KEY} to TESTING"
          else
            echo "::warning::TESTING transition not found"
          fi