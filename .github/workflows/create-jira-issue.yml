name: Create Jira Issue for EPE

on:
  create:

jobs:
  create-epe-issue:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'epe-')
    runs-on: ubuntu-latest

    steps:
      - name: Extract branch name
        id: branch
        run: |
          BRANCH="${{ github.event.ref }}"
          CLEAN=$(echo "$BRANCH" | sed 's/-/ /g' | sed 's/epe //i')
          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          echo "summary=EPE: $CLEAN" >> $GITHUB_OUTPUT

      - name: Create Jira Issue
        id: create-issue
        env:
          JIRA_BASE_URL: ${{ secrets.EPE2_JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.EPE2_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.EPE2_JIRA_API_TOKEN }}
          JIRA_ASSIGNEE_ID: ${{ secrets.EPE2_JIRA_ASSIGNEE_ID }}
          ISSUE_SUMMARY: ${{ steps.branch.outputs.summary }}
        run: |
          AUTH=$(echo -n "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" | base64 -w 0)

          PAYLOAD=$(jq -n \
            --arg summary "$ISSUE_SUMMARY" \
            --arg assignee "$JIRA_ASSIGNEE_ID" \
            '{
              fields: {
                project: { key: "DC" },
                summary: $summary,
                issuetype: { id: "10009" },
                customfield_10033: { id: "10069" },
                assignee: { id: $assignee }
              }
            }')

          echo "Payload: $PAYLOAD"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${JIRA_BASE_URL}/rest/api/3/issue" \
            -H "Authorization: Basic ${AUTH}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Jira API returned HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

          ISSUE_KEY=$(echo "$BODY" | jq -r '.key')
          echo "Created: $ISSUE_KEY"
          echo "key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          echo "id=$(echo "$BODY" | jq -r '.id')" >> $GITHUB_OUTPUT

      - name: Transition to DOING
        env:
          JIRA_BASE_URL: ${{ secrets.EPE2_JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.EPE2_JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.EPE2_JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.create-issue.outputs.key }}
        run: |
          AUTH=$(echo -n "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" | base64 -w 0)

          TRANSITIONS=$(curl -s \
            "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions" \
            -H "Authorization: Basic ${AUTH}" \
            -H "Content-Type: application/json")

          echo "Available transitions: $TRANSITIONS"

          DOING_ID=$(echo "$TRANSITIONS" | jq -r '.transitions[] | select(.name == "DOING") | .id')

          if [ -n "$DOING_ID" ]; then
            curl -s -X POST \
              "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions" \
              -H "Authorization: Basic ${AUTH}" \
              -H "Content-Type: application/json" \
              -d "{\"transition\": {\"id\": \"$DOING_ID\"}}"
            echo "Transitioned ${ISSUE_KEY} to DOING"
          else
            echo "::warning::DOING transition not found"
          fi